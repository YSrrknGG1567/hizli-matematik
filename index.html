<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Hızlı Matematik</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif;user-select:none;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#121225;color:#fff;display:flex;justify-content:center;align-items:center;min-height:100vh}
.wrap{width:350px;padding:12px;text-align:center}
.box{background:#1e1e3f;padding:12px;border-radius:12px;margin-bottom:10px}
.btn{border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer;padding:12px;font-size:15px}
.btn:active{transform:scale(.96)}
.bar-bg{width:100%;height:12px;background:#1e1e3f;border-radius:8px;overflow:hidden;margin:8px 0}
#bar{width:100%;height:100%;background:#00b894;transition:width .05s linear}
.card-out{background:#fff;padding:6px;border-radius:18px;width:240px;margin:8px auto}
#card{background:#e74c3c;border-radius:14px;padding:10px;height:165px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.oval{background:#fff;border-radius:36px;width:175px;height:82px;display:flex;flex-direction:column;justify-content:center;align-items:center}
#soru{color:#121225;font-size:22px;font-weight:bold}
#cevap{color:#0f3460;font-size:20px;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kbtn{padding:14px;font-size:18px;border:none;border-radius:10px;color:#fff;font-weight:bold;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;justify-content:center;align-items:center;padding:16px}
.mbox{background:#1e1e3f;padding:18px;border-radius:14px;width:310px;text-align:center}
input{width:100%;padding:10px;border-radius:8px;border:2px solid #0984e3;background:#121225;color:#fff;font-size:16px;text-align:center;margin:10px 0}
</style>
</head>
<body>
<div class="wrap" id="menu">
  <div class="box" style="color:#ffd32a;font-weight:bold" id="mRekor">EN YÜKSEK SKORUN: 0</div>
  <h1 style="margin:30px 0 4px">HIZLI MATEMATİK</h1>
  <div style="color:#a2a8d3;font-size:13px;margin-bottom:28px">UNO Kartlı Zeka Yarışı</div>
  <button class="btn" style="background:#0984e3;width:240px;font-size:18px;padding:16px" onclick="isimAc()">OYNA</button><br><br>
  <button class="btn" style="background:#ffd32a;color:#121225;width:240px" onclick="magazaAc()">MAĞAZA</button><br><br><br>
  <button class="btn" style="background:#6c5ce7;width:240px" onclick="skorAc()">SKOR TABLOSU</button>
</div>

<div class="wrap" id="oyun" style="display:none">
  <div class="box" style="display:flex;justify-content:space-between;align-items:center;padding:8px">
    <button class="btn" style="background:#ff4757;padding:6px 10px" onclick="geriAc()">←</button>
    <button class="btn" id="pBtn" style="background:#636e72;padding:6px 10px" onclick="duraklat()">II</button>
    <span id="ustTxt" style="color:#ff6b81;font-size:12px;font-weight:bold">Can:3 P:0 S:1</span>
    <span id="altinTxt" style="color:#ffd32a;font-size:12px;font-weight:bold">Altın:50</span>
    <button class="btn" style="background:#ffd32a;color:#121225;padding:6px 10px;font-size:12px" onclick="magazaAc()">Mağaza</button>
  </div>
  <div class="bar-bg"><div id="bar"></div></div>
  <div class="card-out"><div id="card">
    <div style="width:100%;text-align:left;font-weight:bold" id="k1">?</div>
    <div class="oval"><div id="soru">12 + 8</div><div id="cevap">?</div></div>
    <div style="width:100%;text-align:right;font-weight:bold" id="k2">?</div>
  </div></div>
  <div style="display:flex;gap:6px;justify-content:center;margin:8px 0">
    <button class="btn" id="dBtn" style="background:#0984e3;padding:8px 10px;font-size:13px" onclick="joker('d')">Dondur (1)</button>
    <button class="btn" id="sBtn" style="background:#6c5ce7;padding:8px 10px;font-size:13px" onclick="joker('s')">+10sn (0)</button>
    <button class="btn" style="background:#e17055;padding:8px 12px;font-size:13px" onclick="joker('a')">Atla</button>
  </div>
  <div id="msg" style="color:#00b894;font-size:13px;font-weight:bold;min-height:18px">Başladı!</div>
  <div class="grid" id="pad"></div>
  <button class="btn" id="gBtn" style="background:#00b894;width:100%" onclick="kontrol()">GÖNDER</button>
  <button class="btn" id="tBtn" style="background:#ff4757;width:100%;display:none" onclick="baslat()">TEKRAR OYNA</button>
</div>

<div class="modal" id="modal"><div class="mbox" id="mContent"></div></div>

<script>
const DB="https://"+"hizli-matematik-10492-default-rtdb"+".europe-west1.firebasedatabase.app/skorlar.json";
const uno=["#e74c3c","#2980b9","#27ae60","#f39c12"];
let d={isim:"Oyuncu",puan:0,can:3,svy:1,dc:0,kalan:7,max:7,donma:0,aktif:false,dur:false,altin:50,rekor:0,kombo:0,jd:1,js:0,jc:0,girdi:"",soru:"",simge:"+",renk:"#e74c3c"};

const renkler=["#c0392b","#1f618d","#1e8449","#d68910"];
[["7","8","9"],["4","5","6"],["1","2","3"],["-","0","SİL"]].forEach((r,i)=>r.forEach(t=>{
  let b=document.createElement("button");b.className="kbtn";b.textContent=t;
  b.style.background=t=="SİL"?"#ff4757":(t=="-"?"#6c5ce7":renkler[i]);
  b.onclick=()=>tus(t);document.getElementById("pad").appendChild(b);
}));

function modalAc(html){document.getElementById("mContent").innerHTML=html;document.getElementById("modal").style.display="flex";}
function modalKapat(){document.getElementById("modal").style.display="none";}

function isimAc(){
  modalAc(`<h3>Oyuncu Adı</h3><input id="adIn" maxlength="20" placeholder="Name: (Max 20 karakter)" value="${d.isim=='Oyuncu'?'':d.isim}"><button class="btn" style="background:#00b894;width:48%" onclick="adOnay()">Başla</button> <button class="btn" style="background:#636e72;width:48%" onclick="modalKapat()">İptal</button>`);
}
function adOnay(){
  let v=document.getElementById("adIn").value.trim().slice(0,20);
  if(!v)return;d.isim=v;modalKapat();
  document.getElementById("menu").style.display="none";document.getElementById("oyun").style.display="block";baslat();
}
async function skorKaydet(isim,skor){
  if(skor<=0)return;
  try{await fetch(DB,{method:"POST",body:JSON.stringify({isim,skor})});}catch(e){}
}
async function skorAc(){
  modalAc("<h3>Skor Tablosu</h3><p>Yükleniyor...</p>");
  try{
    let res=await(await fetch(DB)).json(),map={};
    if(res)Object.values(res).forEach(v=>{if(v&&v.isim&&(!map[v.isim]||v.skor>map[v.isim]))map[v.isim]=v.skor;});
    let arr=Object.entries(map).sort((a,b)=>b[1]-a[1]).slice(0,10);
    let h=arr.length?arr.map((x,i)=>`<div style="display:flex;justify-content:space-between;margin:6px 0;font-weight:bold"><span>${i+1}. ${x[0]}</span><span style="color:#00b894">${x[1]} P</span></div>`).join(""):"<p>Henüz skor yok!</p>";
    modalAc(`<h3>Skor Tablosu (Top 10)</h3>${h}<br><button class="btn" style="background:#6c5ce7;width:100%" onclick="modalKapat()">Kapat</button>`);
  }catch(e){modalAc(`<h3>Hata</h3><p>İnternet bağlantısını kontrol et</p><button class="btn" onclick="modalKapat()">Kapat</button>`);}
}
function guncelle(){
  document.getElementById("ustTxt").textContent=`Can:${d.can} P:${d.puan} S:${d.svy}`;
  document.getElementById("altinTxt").textContent=`Altın:${d.altin}`;
  document.getElementById("mRekor").textContent=`EN YÜKSEK SKORUN: ${d.rekor}`;
  document.getElementById("dBtn").textContent=`Dondur (${d.jd})`;
  document.getElementById("sBtn").textContent=`+10sn (${d.js})`;
  document.getElementById("cevap").textContent=d.girdi||"?";
}
function yeniSoru(){
  d.aktif=true;let ys=d.puan<50?1:(d.puan<100?2:3);if(ys>d.svy)d.svy=ys;
  d.kalan=d.max=7+(d.svy-1)*3;d.donma=0;d.girdi="";
  let ust=d.svy==1?10:(d.svy==2?20:50),s1=1+Math.floor(Math.random()*ust),s2=1+Math.floor(Math.random()*ust);
  let isl=["+","-","*"][Math.floor(Math.random()*3)];
  d.dc=isl=="+"?s1+s2:(isl=="-"?s1-s2:s1*s2);d.simge=isl=="*"?"x":isl;
  d.soru=`${s1} ${d.simge} ${s2}`;d.renk=uno[Math.floor(Math.random()*4)];
  document.getElementById("card").style.background=d.renk;
  document.getElementById("soru").textContent=d.soru;
  document.getElementById("k1").textContent=document.getElementById("k2").textContent=d.simge;guncelle();
}
function baslat(){
  d.puan=0;d.can=3+d.jc;d.svy=1;d.kombo=0;d.dur=false;
  document.getElementById("pBtn").textContent="II";document.getElementById("gBtn").style.display="block";document.getElementById("tBtn").style.display="none";
  document.getElementById("msg").textContent=`İyi şanslar ${d.isim}!`;yeniSoru();
}
function bitti(sebep){
  d.aktif=false;d.kombo=0;if(d.puan>d.rekor)d.rekor=d.puan;skorKaydet(d.isim,d.puan);
  document.getElementById("card").style.background="#e74c3c";document.getElementById("soru").textContent="OYUN BİTTİ";
  document.getElementById("cevap").textContent=d.puan+" P";document.getElementById("msg").textContent=`${sebep} | Rekor: ${d.rekor}`;
  document.getElementById("gBtn").style.display="none";document.getElementById("tBtn").style.display="block";guncelle();
}
function tus(t){
  if(!d.aktif||d.dur||d.can<=0)return;
  if(t=="SİL")d.girdi=d.girdi.slice(0,-1);
  else if(t=="-")d.girdi=d.girdi.startsWith("-")?d.girdi.slice(1):"-"+d.girdi;
  else d.girdi+=t;guncelle();
}
function kontrol(){
  if(!d.aktif||d.dur||d.can<=0||d.girdi===""||d.girdi==="-")return;
  if(parseInt(d.girdi)===d.dc){
    d.kombo++;let k=10+(d.kombo-1)*2;d.puan+=k;d.altin+=10;
    document.getElementById("msg").textContent=`Harika! +${k} Puan | +10 Altın`;yeniSoru();
  }else{
    d.can--;d.kombo=0;if(d.can<=0)bitti(`Doğrusu ${d.dc} idi`);
    else{document.getElementById("msg").textContent=`Yanlış! Doğrusu ${d.dc} idi`;yeniSoru();}
  }
}
function joker(t){
  if(!d.aktif||d.dur||d.can<=0)return;
  if(t=="d"&&d.jd>0){d.jd--;d.donma+=5;document.getElementById("msg").textContent="Zaman Dondu! (5s)";guncelle();}
  else if(t=="s"&&d.js>0){d.js--;d.kalan+=10;d.max=Math.max(d.max,d.kalan);document.getElementById("msg").textContent="+10sn Eklendi!";guncelle();}
  else if(t=="a"){document.getElementById("msg").textContent=`Atlandı! (Cevap ${d.dc})`;yeniSoru();}
}
function duraklat(){
  if(!d.aktif||d.can<=0)return;d.dur=!d.dur;
  document.getElementById("pBtn").textContent=d.dur?">":"II";
  document.getElementById("soru").textContent=d.dur?"DURAKLATILDI":d.soru;
}
function geriAc(){
  let esk=d.dur;d.dur=true;
  modalAc(`<h3>Menüye Dön</h3><p>${d.isim} - Puan: ${d.puan}</p><button class="btn" style="background:#00b894;width:100%;margin-bottom:8px" onclick="geriSec(true)">Skoru Kaydet</button><button class="btn" style="background:#ff4757;width:100%;margin-bottom:8px" onclick="geriSec(false)">Kaydetme</button><button class="btn" style="background:#636e72;width:100%" onclick="d.dur=${esk};modalKapat()">İptal</button>`);
}
function geriSec(k){
  if(k){if(d.puan>d.rekor)d.rekor=d.puan;skorKaydet(d.isim,d.puan);}
  d.aktif=false;d.dur=false;modalKapat();guncelle();
  document.getElementById("oyun").style.display="none";document.getElementById("menu").style.display="block";
}
function magazaAc(){
  let esk=d.dur;d.dur=true;
  modalAc(`<h3>Mağaza (Altın: ${d.altin})</h3><button class="btn" style="background:#0984e3;width:100%;margin:5px 0" onclick="al('d',30)">Dondur (5s) - 30 Altın</button><button class="btn" style="background:#6c5ce7;width:100%;margin:5px 0" onclick="al('s',50)">+10sn Süre - 50 Altın</button><button class="btn" style="background:#e94560;width:100%;margin:5px 0" onclick="al('c',60)">Kalıcı +1 Can - 60 Altın</button><br><br><button class="btn" style="background:#00b894;width:100%" onclick="d.dur=${esk};modalKapat()">Kapat</button>`);
}
function al(t,f){
  if(d.altin<f)return alert("Yetersiz altın!");d.altin-=f;
  if(t=="d")d.jd++;else if(t=="s")d.js++;else{d.jc++;if(d.can>0)d.can++;}guncelle();magazaAc();
}
setInterval(()=>{
  if(d.aktif&&!d.dur&&d.can>0){
    if(d.donma>0){d.donma-=0.05;document.getElementById("bar").style.background="#00cec9";}
    else{
      d.kalan-=0.05;let o=Math.max(0,d.kalan/d.max);
      document.getElementById("bar").style.width=(o*100)+"%";
      document.getElementById("bar").style.background=o>.5?"#00b894":(o>.25?"#ffd32a":"#ff4757");
      if(d.kalan<=0){d.can--;d.kombo=0;if(d.can<=0)bitti("SÜRE DOLDU!");else yeniSoru();}
    }
  }
},50);
</script>
</body>
</html>
